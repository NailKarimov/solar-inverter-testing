[project]
name = "inverter-lab"
version = "1.0.0"
description = "A simulated solar inverter (Modbus RTU/TCP, SunSpec) and the tests that prove it behaves"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "hypothesis>=6.112",
  "allure-pytest>=2.13",
  "pymodbus~=3.16.0",
  "pysunspec2~=1.3.7",
  "ruff>=0.7",
  "mypy>=1.13",
]
pages = ["playwright>=1.48"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --timeout=120"
markers = [
  "smoke: the critical path, run first",
  "once: does not use a link; runs only in the in-memory run",
  "rtu: serial-line framing; skipped with LINK=tcp",
  "tcp: Modbus TCP only; runs with LINK=tcp",
  "port: a third-party client needs a real port; skipped in the in-memory run",
  "bench: needs the bench (LINK=serial://PORT)",
  "internal: reads the simulator's memory; skipped on the bench",
  "pages: opens the visual pages in a browser (needs Playwright)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/mutants.py" = ["E501"]  # the planted changes quote source lines as they are

[tool.ruff.lint.isort]
known-first-party = ["inverter_lab", "support", "conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_calls = false  # pyserial, pysunspec2 and allure have no type hints
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["serial", "serial.*", "sunspec2", "sunspec2.*"]
ignore_missing_imports = true
