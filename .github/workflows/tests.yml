name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 3 * * *' # nightly, 03:20 UTC
  workflow_dispatch:
    inputs:
      mutants:
        description: 'Also run the mutation check (about 15 minutes)'
        type: boolean
        default: false

permissions:
  contents: write # publish the reports and the visual page to gh-pages

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q socat
          pip install -e ".[dev,pages]"
          python -m playwright install --with-deps chromium

      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy src tests scripts

      - name: Tests in memory
        id: memory
        continue-on-error: true
        run: pytest -m "not pages" --alluredir=allure-results

      - name: Same tests over virtual serial ports
        id: socat
        continue-on-error: true
        env:
          LINK: socat
        run: pytest --alluredir=allure-results

      - name: Same tests over Modbus TCP
        id: tcp
        continue-on-error: true
        env:
          LINK: tcp
        run: pytest --alluredir=allure-results

      - name: Build the visual page from this run
        id: build
        run: python scripts/build_pages.py --check

      - name: JavaScript twin answers like the Python simulator
        id: twin
        continue-on-error: true
        run: node site/test/twin.test.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The visual page in a browser
        id: pages
        continue-on-error: true
        env:
          EVIDENCE: '0'
        run: pytest -m pages --alluredir=allure-results

      - name: Allure report with history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 && git worktree add gh-pages-old origin/gh-pages \
            && cp -r gh-pages-old/history allure-results/ 2>/dev/null || true
          npx --yes allure-commandline@2 generate allure-results --clean -o site-out
          cp docs/solar-inverter.html site-out/
          mkdir -p site-out/mutants && cp mutants-result.md site-out/mutants/result.md

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site-out
          keep_files: true

      - name: Fail the job if anything failed
        if: >-
          steps.memory.outcome == 'failure' || steps.socat.outcome == 'failure' || steps.tcp.outcome == 'failure'
          || steps.twin.outcome == 'failure' || steps.pages.outcome == 'failure'
        run: exit 1

  mutants:
    # On demand: 38 planted bugs, the whole suite once per bug.
    if: inputs.mutants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q socat
          pip install -e ".[dev]"
      - name: Mutation check
        run: |
          python scripts/mutants.py
          cat mutants-result.md >> "$GITHUB_STEP_SUMMARY"

  # Nightly run on the bench. Uncomment when a self-hosted runner with the label "hil" exists.
  # Never trigger it on pull_request: code from a fork would run on your home machine.
  # hil:
  #   if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
  #   runs-on: [self-hosted, hil]
  #   env:
  #     LINK: serial:///dev/ttyUSB1?baud=9600
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: python3 -m venv .venv && .venv/bin/pip install -e ".[dev]" && .venv/bin/pytest -m "not pages"
